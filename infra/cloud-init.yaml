#cloud-config
package_update: true
package_upgrade: false
package_reboot_if_required: false

packages:
  - ca-certificates
  - docker.io
  - docker-compose-v2

write_files:
  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: '0644'
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }

runcmd:
  - [bash, -ceu, 'systemctl enable docker && systemctl restart docker']
