name: CCGC employee access

# Run from the Actions tab. Enrollment creates a direct LiteLLM virtual key;
# revocation removes the employee's LiteLLM user, keys, and Copilot connection.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Enroll issues a 90-day LiteLLM key; revoke removes the employee's access
        type: choice
        options:
          - enroll
          - revoke
        default: enroll
        required: true
      github_username:
        description: Employee GitHub username (the account must have a GitHub Copilot seat)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ccgc-employee-access-${{ inputs.github_username }}
  cancel-in-progress: false

jobs:
  access:
    name: ${{ inputs.action }} ${{ inputs.github_username }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ccgc-admin
    env:
      ACTION: ${{ inputs.action }}
      GITHUB_USERNAME: ${{ inputs.github_username }}
      LITELLM_URL: ${{ vars.LITELLM_URL }}
    steps:
      - name: Validate request
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$ACTION" == enroll || "$ACTION" == revoke ]] || fail 'Unsupported action.'
          [[ "$GITHUB_USERNAME" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]] \
            || fail 'github_username is not a valid GitHub username.'
          [[ "$LITELLM_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]] \
            || fail 'Set the ccgc-admin environment variable LITELLM_URL to the LiteLLM HTTPS origin.'

      - name: Check out access workflow
        uses: actions/checkout@v4

      - name: Build employee setup file
        if: inputs.action == 'enroll'
        run: |
          set -euo pipefail
          node scripts/build-installer.mjs --gateway "$LITELLM_URL" \
            --output "$RUNNER_TEMP/ccgc-setup/ccgc-enterprise-setup.command"

      - name: Provision access directly in LiteLLM
        env:
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$LITELLM_MASTER_KEY" =~ ^sk-[A-Za-z0-9._-]{16,}$ ]] \
            || { echo '::error::Set the ccgc-admin environment secret LITELLM_MASTER_KEY.'; exit 1; }
          node scripts/enterprise-actions-access.mjs >> "$GITHUB_STEP_SUMMARY"

      # Contains no secret: the employee script with this deployment's LiteLLM URL built in.
      - name: Attach employee setup file
        id: setup-file
        if: inputs.action == 'enroll'
        uses: actions/upload-artifact@v4
        with:
          name: ccgc-enterprise-setup
          path: ${{ runner.temp }}/ccgc-setup/ccgc-enterprise-setup.command
          if-no-files-found: error
          retention-days: 30

      - name: Link employee setup file
        if: inputs.action == 'enroll'
        env:
          ARTIFACT_URL: ${{ steps.setup-file.outputs.artifact-url }}
        run: |
          set -euo pipefail
          sha256="$(sha256sum "$RUNNER_TEMP/ccgc-setup/ccgc-enterprise-setup.command" | cut -d ' ' -f 1)"
          {
            echo
            echo '### Employee setup file'
            echo
            echo "Download [ccgc-enterprise-setup]($ARTIFACT_URL), unzip it, and send \`ccgc-enterprise-setup.command\` with the key."
            echo
            echo "SHA-256: \`$sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"
