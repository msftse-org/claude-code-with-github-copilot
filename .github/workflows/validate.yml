name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos-enrollment:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: node --test test/macos-enrollment-script.test.ts test/github-cli-install.test.ts

  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: bash -n scripts/ccgc-enterprise-macos.sh
      - run: node scripts/deploy.mjs --help
      - run: az bicep install --version v0.48.1
      - run: az bicep build --file infra/main.bicep --stdout > "$RUNNER_TEMP/main.json"
      - run: az bicep lint --file infra/main.bicep
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform test
