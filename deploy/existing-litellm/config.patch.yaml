# Merge these values into the customer's existing LiteLLM configuration.
# Existing model_list, keys, teams, budgets, and callbacks remain unchanged.
general_settings:
  custom_auth: ccgc_litellm_auth.user_api_key_auth
  custom_auth_run_common_checks: true
  custom_auth_settings:
    mode: auto

litellm_settings:
  enable_post_custom_auth_checks: true
